/**:
  ros__parameters:
    arm_name: right_arm

    # 左右臂共用同一个物理 CAN 接口
    can_interface: can0

    # 当前节点属于右臂：right 处理偶数 CAN ID
    arm_side: right

    # activate 前必须完成本臂初始位姿同步
    require_initial_pose_before_activate: true

    # 通信断开后进入故障停机流程，并向外部 manager 发布 fault
    fault_stop_on_comm_loss: true

    base_frame: right_arm_base
    ee_frame: right_gripper_link
    debug_mode: true

    publish_rate_hz: 50.0

    joint_names:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_gripper_motor

    joint.position_limit_min: [-3.14, -2.50, -2.50, 0.00]
    joint.position_limit_max: [ 3.14,  2.50,  2.50, 1.00]
    joint.max_velocity:       [ 1.50,  1.50,  1.50, 1.00]

    safety.max_current: 500.0
    safety.max_temperature: 100.0
    safety.communication_timeout_sec: 0.2